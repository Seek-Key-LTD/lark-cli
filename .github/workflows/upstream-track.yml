# 声明（gitea-actions-control-plane.md 公约 v0.1 的 GitHub 侧同款）
# repository: Seek-Key-LTD/lark-cli（larksuite/cli 的 fork，公开）
# purpose: 每日检查上游最新 release；若本仓尚无对应构建产物（pub-<ver> tag），触发 build.yml 构建
# trigger: schedule 每日 03:30（北京）+ workflow_dispatch（可指定版本，用于回填/测试）
# execution_class: 公开轻量任务（GitHub 托管 runner）；不使用任何自配 secrets
# tac_action: push-to-main 即审批
# rollback: 删除本 workflow 即停；retirement: 不再跟踪上游时删除
name: 🔎 upstream-track（每日检查上游 → 缺则触发构建）

on:
  schedule:
    - cron: '30 19 * * *'   # 每日 03:30（北京，UTC+8）
  workflow_dispatch:
    inputs:
      version:
        description: '指定上游 tag（如 v1.0.96；留空 = 最新 release）'
        required: false

permissions:
  contents: read
  actions: write

env:
  UPSTREAM: larksuite/cli

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 拣选目标版本
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VER="$INPUT_VERSION"
          else
            VER=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "target: $VER"

      - name: 🧮 已有产物吗（pub-$VER tag）
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.pick.outputs.version }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/pub-${VER}" >/dev/null 2>&1; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "✅ pub-${VER} 已有构建产物，本轮无需动作"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "🎯 pub-${VER} 缺失 → 触发 build.yml"
          fi

      - name: 🚀 触发构建
        if: steps.check.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VER"
          echo "✅ 已触发 build.yml @ ${VER}（进度见 Actions → 📦 build）"
